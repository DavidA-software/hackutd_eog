spring.application.name=eog-backend
server.port=8081

# Where datasets live. Each subfolder with network.json, ops.json, telemetry.csv is a dataset.
# Paths are relative to backend/springboot/ (where `mvn spring-boot:run` runs).
# Point it elsewhere at startup:  mvn spring-boot:run -Dspring-boot.run.arguments=--app.data-dir=/path/to/folder
app.data-dir=../../data

# The Python analysis engine. Use the full path to python if `python3` isn't on PATH
# (for conda: the output of `which python`).
app.python-cmd=python3
app.analyze-script=../python/analyze.py
app.analysis-timeout-seconds=120

app.cors-origins=http://localhost:5173,http://localhost:3000

# Telemetry files are ~25 MB; allow uploads well above that.
spring.servlet.multipart.max-file-size=300MB
spring.servlet.multipart.max-request-size=400MB

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EOG Console - Datasets</title>
<style>
  body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: #e2e8f0; margin: 0; padding: 32px; }
  main { max-width: 720px; margin: 0 auto; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  p.sub { color: #94a3b8; margin: 0 0 24px; }
  section { background: #1e293b; border: 1px solid #334155; border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  h2 { font-size: 16px; margin: 0 0 12px; }
  label { display: block; font-size: 13px; color: #94a3b8; margin: 10px 0 4px; }
  input[type=text], input[type=file] { width: 100%; box-sizing: border-box; padding: 8px; background: #0f172a; color: #e2e8f0; border: 1px solid #334155; border-radius: 6px; }
  button { margin-top: 16px; padding: 10px 18px; background: #f97316; color: #fff; border: 0; border-radius: 6px; font-weight: 600; cursor: pointer; }
  button:disabled { opacity: .5; cursor: wait; }
  .or { text-align: center; color: #64748b; font-size: 12px; margin: 14px 0 0; }
  #msg { margin-top: 12px; font-size: 14px; }
  .ok { color: #4ade80; } .err { color: #f87171; }
  ul { list-style: none; padding: 0; margin: 0; }
  li { display: flex; justify-content: space-between; align-items: center; padding: 10px 0; border-bottom: 1px solid #334155; }
  li:last-child { border-bottom: 0; }
  li small { color: #94a3b8; display: block; }
  a { color: #38bdf8; font-size: 13px; }
  code { background: #0f172a; padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<main>
  <h1>Datasets</h1>
  <p class="sub">Add a dataset (network.json, ops.json, telemetry.csv). It appears in the console's dataset list right away.</p>

  <section>
    <h2>Upload a dataset</h2>
    <form id="form">
      <label for="name">Name</label>
      <input type="text" id="name" name="name" value="test" required pattern="[A-Za-z0-9_.\-]+">

      <label for="network">network.json</label>
      <input type="file" id="network" name="network" accept=".json">
      <label for="ops">ops.json</label>
      <input type="file" id="ops" name="ops" accept=".json">
      <label for="telemetry">telemetry.csv</label>
      <input type="file" id="telemetry" name="telemetry" accept=".csv">

      <p class="or">or one zip containing all three</p>
      <label for="zip">Zip file</label>
      <input type="file" id="zip" name="zip" accept=".zip">

      <button type="submit" id="submit">Upload</button>
      <div id="msg"></div>
    </form>
  </section>

  <section>
    <h2>Available datasets</h2>
    <ul id="list"><li>Loading...</li></ul>
    <p class="sub" style="margin-top:12px">You can also copy a folder straight into the <code>data/</code> directory.</p>
  </section>
</main>
<script>
  const list = document.getElementById('list');
  const msg = document.getElementById('msg');

  async function refresh() {
    try {
      const res = await fetch('/api/datasets');
      const items = await res.json();
      list.innerHTML = items.length ? '' : '<li>No datasets yet</li>';
      for (const d of items) {
        const li = document.createElement('li');
        li.innerHTML = `<div><strong></strong><small></small></div><a target="_blank">View analysis JSON</a>`;
        li.querySelector('strong').textContent = d.name;
        li.querySelector('small').textContent = d.description;
        li.querySelector('a').href = '/api/analysis?dataset=' + encodeURIComponent(d.name);
        list.appendChild(li);
      }
    } catch (e) {
      list.innerHTML = '<li class="err">Could not reach the API</li>';
    }
  }

  document.getElementById('form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const form = new FormData();
    form.append('name', document.getElementById('name').value.trim());
    for (const id of ['network', 'ops', 'telemetry', 'zip']) {
      const f = document.getElementById(id).files[0];
      if (f) form.append(id, f);
    }
    const btn = document.getElementById('submit');
    btn.disabled = true;
    msg.className = ''; msg.textContent = 'Uploading...';
    try {
      const res = await fetch('/api/datasets', { method: 'POST', body: form });
      const body = await res.json();
      if (!res.ok) throw new Error(body.error || res.statusText);
      msg.className = 'ok'; msg.textContent = `Saved "${body.saved}". Select it in the console.`;
      refresh();
    } catch (err) {
      msg.className = 'err'; msg.textContent = err.message;
    } finally {
      btn.disabled = false;
    }
  });

  refresh();
</script>
</body>
</html>
